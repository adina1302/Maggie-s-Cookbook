<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C65D2E">
<title>Maggie's Cookbook</title>

<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maggie's Cookbook">

<link rel="apple-touch-icon" href="icon.png">

<style>
:root{
  --burnt:#C65D2E;
  --cream:#F8F2E7;
  --sage:#A7B89A;
  --text:#4A3428;
  --card:#FFFFFF;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--cream);
  color:var(--text);
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.hero{
  background:linear-gradient(135deg,var(--burnt),#d97a4d);
  color:white;
  padding:24px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.12);
}

.subtitle{opacity:.9;margin-top:6px}

.card{
  background:var(--card);
  border-radius:20px;
  padding:16px;
  margin-top:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

input,textarea,select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #ddd;
  margin-top:8px;
  margin-bottom:10px;
}

button{
  border:none;
  border-radius:14px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:600;
}

.primary{background:var(--burnt);color:white;}
.secondary{
  background:var(--sage);
  color:white;
}

.meal-img{
  width:100%;
  border-radius:14px;
  margin-top:10px;
  max-height:300px;
  object-fit:cover;
}

.tag{
  display:inline-block;
  background:var(--sage);
  color:white;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
}

.favorite{
  font-size:22px;
  cursor:pointer;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:14px;
}

.favorite-glow{
  box-shadow:0 6px 20px rgba(198,93,46,0.25);
  border:1px solid rgba(198,93,46,0.25);
  transform:scale(1.01);
}

.star-container{
  display:flex;
  gap:6px;
  font-size:26px;
  cursor:pointer;
}

.star{
  transition:0.15s;
}

.star:hover{
  transform:scale(1.2);
}

/* animation */
@keyframes fadeIn {
  from {opacity:0; transform:translateY(10px);}
  to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="container">

  <div class="hero">
    <h1>🍳 Maggie’s Kitchen Journal</h1>
    <p class="subtitle">Every meal, saved with love 💛</p>
  </div>

  <!-- SEARCH -->
  <div class="card">
    <input id="search" placeholder="🔍 Search meals..." oninput="renderMeals()">
    <button class="primary" onclick="randomMeal()">🎲 What should I cook today?</button>
    <div id="randomBox"></div>
  </div>

  <!-- FILTER -->
  <div class="card">
    <p><strong>Filter</strong></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="secondary" id="filter-All" onclick="setFilter('All')">All</button>
      <button class="secondary" id="filter-Breakfast" onclick="setFilter('Breakfast')">Breakfast</button>
      <button class="secondary" id="filter-Lunch" onclick="setFilter('Lunch')">Lunch</button>
      <button class="secondary" id="filter-Dinner" onclick="setFilter('Dinner')">Dinner</button>
      <button class="secondary" id="filter-Dessert" onclick="setFilter('Dessert')">Dessert</button>
    </div>
  </div>

  <!-- ADD BUTTON -->
  <div class="card">
    <button class="primary" onclick="toggleAddMeal()">➕ Add a new recipe</button>

    <div id="addMealForm" style="display:none;margin-top:12px;">

      <input id="name" placeholder="What did Maggie cook? 🍝">

      <select id="tag">
        <option>Breakfast</option>
        <option>Lunch</option>
        <option>Dinner</option>
        <option>Dessert</option>
      </select>

      <p>Rating ⭐</p>
      <div id="stars" class="star-container"></div>

      <input id="date" type="date">

      <textarea id="ingredients" placeholder="🥕 Ingredients"></textarea>

      <textarea id="recipe" placeholder="👩‍🍳 Recipe"></textarea>

      <input id="photo" type="file" accept="image/*">

      <button class="primary" onclick="saveMeal()">Save 💛</button>
    </div>
  </div>

  <!-- MEALS -->
  <div id="meals" class="grid"></div>

</div>

<script>

let meals = JSON.parse(localStorage.getItem("maggiesCookbook")) || [];
let selectedRating = 5;
let currentFilter = "All";

function saveMeals(){
  localStorage.setItem("maggiesCookbook", JSON.stringify(meals));
}

/* toggle form */
function toggleAddMeal(){
  const form = document.getElementById("addMealForm");
  form.style.display = form.style.display === "none" ? "block" : "none";
}

/* stars */
function setupStars(){
  const container = document.getElementById("stars");
  container.innerHTML = "";

  for(let i=1;i<=5;i++){
    const star = document.createElement("span");
    star.innerHTML = i <= selectedRating ? "★" : "☆";

    star.onclick = ()=>{
      selectedRating = i;
      setupStars();
    };

    container.appendChild(star);
  }
}
setupStars();

/* filter */
function setFilter(type){
  currentFilter = type;

  document.querySelectorAll(".secondary").forEach(b=>{
    b.classList.remove("active");
  });

  const btn = document.getElementById("filter-"+type);
  if(btn) btn.classList.add("active");

  renderMeals();
}

/* save */
function saveMeal(){
  const file = document.getElementById("photo").files[0];

  const meal = {
    name: document.getElementById("name").value.trim(),
    tag: document.getElementById("tag").value,
    rating: selectedRating,
    date: document.getElementById("date").value,
    ingredients: document.getElementById("ingredients").value,
    recipe: document.getElementById("recipe").value,
    favorite:false
  };

  if(!meal.name) return alert("Add a name!");

  const finish = ()=>{
    meals.unshift(meal);
    saveMeals();
    renderMeals();
    toggleAddMeal();

    selectedRating = 5;
    setupStars();
  };

  if(file){
    const r = new FileReader();
    r.onload = e=>{ meal.photo = e.target.result; finish(); };
    r.readAsDataURL(file);
  } else {
    meal.photo="";
    finish();
  }
}

/* favorite */
function toggleFavorite(name){
  const m = meals.find(x=>x.name===name);
  if(!m) return;
  m.favorite = !m.favorite;
  saveMeals();
  renderMeals();
}

/* random */
function randomMeal(){
  const box = document.getElementById("randomBox");
  if(!meals.length) return box.innerHTML="Add meals first 💛";

  const m = meals[Math.floor(Math.random()*meals.length)];

  box.innerHTML = `
    <div class="card">
      <h3>🎲 Try: ${m.name}</h3>
      ${m.photo?`<img class="meal-img" src="${m.photo}">`:""}
      <p>${"⭐".repeat(m.rating||0)}</p>
    </div>
  `;
}

/* render */
function renderMeals(){
  const q = document.getElementById("search").value.toLowerCase();
  const box = document.getElementById("meals");

  box.innerHTML="";

  const sorted = [...meals].sort((a,b)=>(b.favorite)-(a.favorite));

  sorted.forEach(m=>{
    if(!m.name.toLowerCase().includes(q) && !m.tag.toLowerCase().includes(q)) return;
    if(currentFilter!=="All" && m.tag!==currentFilter) return;

    box.innerHTML += `
      <div class="card ${m.favorite?"favorite-glow":""}" style="animation:fadeIn .3s;">

        <div style="display:flex;justify-content:space-between;">
          <h3>${m.name}</h3>
          <span class="favorite" onclick="toggleFavorite('${m.name}')">
            ${m.favorite?"❤️":"🤍"}
          </span>
        </div>

        ${m.photo?`<img class="meal-img" src="${m.photo}">`:""}

        <span class="tag">${m.tag}</span>

        <p>${"⭐".repeat(m.rating||0)}</p>

        <p>🥕 ${m.ingredients||""}</p>
        <p>👩‍🍳 ${m.recipe||""}</p>
      </div>
    `;
  });
}

renderMeals();

</script>

</body>
</html>
