<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C65D2E">
<title>Maggie's Cookbook</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/lucide@latest"></script>

<link rel="manifest" href="manifest.json">

<style>
:root{
  --bg:#F8F2E7;
  --card:#fff;
  --text:#2d2a26;
  --muted:#7a736b;
  --accent:#C65D2E;
}

body{
  margin:0;
  font-family:"Inter", -apple-system, sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:90px;
}

/* HERO */
.hero{
  background:linear-gradient(135deg,var(--accent),#e07b4f);
  color:white;
  padding:26px;
  text-align:center;
  border-radius:0 0 24px 24px;
}

.hero h1{margin:0;font-size:22px;}
.hero p{margin-top:6px;font-size:13px;opacity:0.9}

/* CARD */
.card{
  background:var(--card);
  margin:14px;
  padding:14px;
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

input,textarea,select{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:1px solid rgba(0,0,0,0.1);
}

/* PINTEREST GRID */
.grid{
  column-count:2;
  column-gap:12px;
  padding:12px;
}

.pin{
  break-inside:avoid;
  margin-bottom:12px;
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 6px 16px rgba(0,0,0,0.08);
  cursor:pointer;
}

.pin img{
  width:100%;
  display:block;
}

.pin-title{
  padding:10px;
  font-weight:600;
}

.pin-meta{
  padding:0 10px 10px;
  font-size:12px;
  color:#7a736b;
}

/* NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -6px 20px rgba(0,0,0,0.08);
}

.nav-item{
  color:var(--muted);
  cursor:pointer;
}

.nav-item.active{
  color:var(--accent);
}

/* FAB */
.fab{
  position:fixed;
  bottom:90px;
  right:18px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--accent);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <h1>Maggie's Cookbook</h1>
  <p>Made by Maggie. Taste-tested and approved by Adina ❤️</p>
</div>

<!-- HOME -->
<div id="home" class="view active">
  <div id="grid" class="grid"></div>
</div>

<!-- ADD -->
<div id="add" class="view">
  <div class="card">
    <h3>Add Recipe</h3>

    <input id="name" placeholder="Meal name">

    <!-- ⭐ STARS -->
    <p>Rating</p>
    <div id="stars"></div>

    <input id="lastCooked" type="date">

    <input id="ingredients" placeholder="Ingredients">

    <select id="likedBy">
      <option>Both</option>
      <option>Adina</option>
      <option>Maggie</option>
    </select>

    <textarea id="recipe" placeholder="Recipe"></textarea>

    <input id="photo" type="file" accept="image/*">

    <button onclick="saveMeal()" style="width:100%;padding:12px;border:none;border-radius:12px;background:#C65D2E;color:white;">
      Save
    </button>
  </div>
</div>

<!-- FAVORITES -->
<div id="fav" class="view"></div>

<!-- FLOAT BUTTON -->
<div class="fab" onclick="switchView('add')">
  <i data-lucide="plus"></i>
</div>

<!-- NAV -->
<div class="bottom-nav">
  <div onclick="switchView('home')" class="nav-item"><i data-lucide="home"></i></div>
  <div onclick="switchView('fav')" class="nav-item"><i data-lucide="heart"></i></div>
</div>

<script>

let meals = JSON.parse(localStorage.getItem("cookbook")) || [];
let selectedRating = 5;

/* SAVE */
function saveMeals(){
  localStorage.setItem("cookbook", JSON.stringify(meals));
}

/* VIEW SWITCH */
function switchView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ⭐ STARS */
function renderStars(){
  const el=document.getElementById("stars");
  el.innerHTML="";

  for(let i=1;i<=5;i++){
    const s=document.createElement("span");
    s.innerHTML = i <= selectedRating ? "⭐" : "☆";
    s.style.fontSize="22px";
    s.style.cursor="pointer";

    s.onclick=()=>{selectedRating=i; renderStars();};

    el.appendChild(s);
  }
}

/* SAVE MEAL */
function saveMeal(){
  const file=document.getElementById("photo").files[0];

  const meal={
    id:Date.now(),
    name:document.getElementById("name").value,
    ingredients:document.getElementById("ingredients").value,
    recipe:document.getElementById("recipe").value,
    likedBy:document.getElementById("likedBy").value,
    lastCooked:document.getElementById("lastCooked").value,
    rating:selectedRating,
    favorite:false
  };

  const finish=()=>{
    meals.unshift(meal);
    saveMeals();
    renderHome();
    switchView("home");
  };

  if(file){
    const r=new FileReader();
    r.onload=e=>{
      meal.photo=e.target.result;
      finish();
    };
    r.readAsDataURL(file);
  } else {
    meal.photo="";
    finish();
  }
}

/* HOME (PINTEREST) */
function renderHome(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";

  meals.forEach(m=>{
    grid.innerHTML+=`
      <div class="pin" onclick="openMeal(${m.id})">

        ${m.photo?`<img src="${m.photo}">`:""}

        <div class="pin-title">${m.name}</div>

        <div class="pin-meta">
          ❤️ Liked by ${m.likedBy}<br>
          ⭐ ${m.rating || 0}/5
        </div>

      </div>
    `;
  });

  lucide.createIcons();
}

/* DETAIL VIEW */
function openMeal(id){
  const m=meals.find(x=>x.id===id);

  alert(
`${m.name}

⭐ Rating: ${m.rating}/5
📅 Last cooked: ${m.lastCooked}
❤️ Liked by: ${m.likedBy}

🥕 Ingredients:
${m.ingredients}

🍳 Recipe:
${m.recipe}`
  );
}

/* INIT */
renderStars();
renderHome();
lucide.createIcons();

</script>

</body>
</html>
