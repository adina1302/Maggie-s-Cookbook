<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C65D2E">
<title>Maggie's Cookbook</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --burnt:#C65D2E;
  --cream:#F8F2E7;
  --sage:#A7B89A;
  --text:#4A3428;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--cream);
  color:var(--text);
  padding-bottom:90px;
}

/* HEADER */
.hero{
  background:linear-gradient(135deg,var(--burnt),#d97a4d);
  color:white;
  padding:22px;
  border-radius:0 0 24px 24px;
  text-align:center;
}

/* PAGES */
.view{display:none;animation:fade .25s ease;}
.view.active{display:block;}

@keyframes fade{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:translateY(0);}
}

/* PINTEREST GRID */
.grid{
  columns:2 160px;
  column-gap:12px;
  padding:12px;
}

.pin{
  break-inside:avoid;
  margin-bottom:12px;
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
  cursor:pointer;
  position:relative;
}

.pin img{
  width:100%;
  display:block;
}

.pin-title{
  padding:10px;
  font-weight:600;
}

/* BUTTONS */
button{
  border:none;
  border-radius:12px;
  padding:10px 14px;
  font-weight:600;
  cursor:pointer;
}

.primary{background:var(--burnt);color:white;}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -4px 14px rgba(0,0,0,.1);
}

.nav-item{
  font-size:12px;
  text-align:center;
  color:#666;
  cursor:pointer;
}

.nav-item.active{
  color:var(--burnt);
  font-weight:700;
}

/* FLOATING ADD BUTTON */
.fab{
  position:fixed;
  bottom:85px;
  right:18px;
  width:58px;
  height:58px;
  border-radius:50%;
  background:var(--burnt);
  color:white;
  font-size:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 20px rgba(0,0,0,.2);
  cursor:pointer;
}

/* ADD FORM */
.card{
  background:white;
  margin:14px;
  padding:14px;
  border-radius:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

input,textarea,select{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #ddd;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="view active">

  <div class="hero">
    <h1>🍳 Maggie's Cookbook</h1>
    <p>Made by Maggie. Taste-tested and approved by Adina ❤️</p>
  </div>

  <div id="grid" class="grid"></div>
</div>

<!-- ADD -->
<div id="add" class="view">
  <div class="card">
    <h2>➕ Add Recipe</h2>

    <input id="name" placeholder="Meal name">
    <select id="tag">
      <option>Breakfast</option>
      <option>Lunch</option>
      <option>Dinner</option>
      <option>Dessert</option>
    </select>

    <textarea id="ingredients" placeholder="🥕 Ingredients"></textarea>
    <textarea id="recipe" placeholder="👩‍🍳 Recipe"></textarea>

    <input id="photo" type="file" accept="image/*">

    <button class="primary" onclick="saveMeal()">Save 💛</button>
  </div>
</div>

<!-- FAVORITES -->
<div id="fav" class="view">
  <div class="card">
    <h2>❤️ Favorites</h2>
    <div id="favGrid" class="grid"></div>
  </div>
</div>

<!-- SURPRISE -->
<div id="surprise" class="view">
  <div class="card">
    <button class="primary" onclick="randomMeal()">🎲 Pick for me</button>
    <div id="randomBox"></div>
  </div>
</div>

<!-- FLOATING BUTTON -->
<div class="fab" onclick="switchView('add')">+</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchView('home')">🏠</div>
  <div class="nav-item" onclick="switchView('fav')">❤️</div>
  <div class="nav-item" onclick="switchView('surprise')">🎲</div>
</div>

<script>

let meals = JSON.parse(localStorage.getItem("maggiesCookbook")) || [];

/* SAVE */
function saveMeals(){
  localStorage.setItem("maggiesCookbook", JSON.stringify(meals));
}

/* SWITCH VIEW */
function switchView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));

  renderAll();
}

/* SAVE MEAL */
function saveMeal(){
  const file=document.getElementById("photo").files[0];

  const meal={
    name:document.getElementById("name").value,
    tag:document.getElementById("tag").value,
    ingredients:document.getElementById("ingredients").value,
    recipe:document.getElementById("recipe").value,
    favorite:false
  };

  if(!meal.name) return alert("Add name");

  const finish=()=>{
    meals.unshift(meal);
    saveMeals();
    switchView("home");
  };

  if(file){
    const r=new FileReader();
    r.onload=e=>{meal.photo=e.target.result;finish();}
    r.readAsDataURL(file);
  } else {
    meal.photo="";
    finish();
  }
}

/* TOGGLE FAVORITE */
function toggleFav(name){
  const m=meals.find(x=>x.name===name);
  m.favorite=!m.favorite;
  saveMeals();
  renderAll();
}

/* PINTEREST GRID HOME */
function renderHome(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";

  meals.forEach(m=>{
    grid.innerHTML+=`
      <div class="pin" onclick="toggleFav('${m.name}')">
        ${m.photo?`<img src="${m.photo}">`:""}
        <div class="pin-title">
          ${m.name} ${m.favorite?"❤️":""}
        </div>
      </div>
    `;
  });
}

/* FAVORITES */
function renderFav(){
  const grid=document.getElementById("favGrid");
  grid.innerHTML="";

  meals.filter(m=>m.favorite).forEach(m=>{
    grid.innerHTML+=`
      <div class="pin">
        ${m.photo?`<img src="${m.photo}">`:""}
        <div class="pin-title">${m.name}</div>
      </div>
    `;
  });
}

/* RANDOM */
function randomMeal(){
  const box=document.getElementById("randomBox");
  if(!meals.length) return;

  const m=meals[Math.floor(Math.random()*meals.length)];

  box.innerHTML=`
    <div class="card">
      <h3>🎲 ${m.name}</h3>
      ${m.photo?`<img src="${m.photo}" style="width:100%;border-radius:12px;">`:""}
    </div>
  `;
}

/* RENDER ALL */
function renderAll(){
  renderHome();
  renderFav();
}

renderAll();

</script>

</body>
</html>
