<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C65D2E">
<title>Maggie's Cookbook</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --burnt:#C65D2E;
  --cream:#F8F2E7;
  --text:#3E2C22;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  background:var(--cream);
  color:var(--text);
  padding-bottom:90px;
}

/* ===== SPLASH ===== */
#splash{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#C65D2E,#e07b4f);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  color:white;
  text-align:center;
  animation:splashFade 0.6s ease forwards;
  animation-delay:2.2s;
}

.logo{
  font-size:54px;
  animation:float 1.6s ease-in-out infinite;
  filter:drop-shadow(0 10px 20px rgba(0,0,0,0.25));
}

@keyframes float{
  0%,100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-8px) scale(1.08);}
}

@keyframes splashFade{
  to{opacity:0;visibility:hidden;}
}

/* ===== VIEWS ===== */
.view{display:none;}
.view.active{display:block;}

/* ===== HERO ===== */
.hero{
  background:linear-gradient(135deg,var(--burnt),#e07b4f);
  color:white;
  padding:24px;
  text-align:center;
  border-radius:0 0 24px 24px;
}

/* ===== GRID (EQUAL CARDS) ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}

.pin{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
  cursor:pointer;
  transition:transform .15s ease;
}

.pin:active{transform:scale(0.97);}

.pin img{
  width:100%;
  height:140px;
  object-fit:cover;
}

.pin-title{
  padding:10px;
  font-weight:600;
  font-size:14px;
}

.pin-actions{
  display:flex;
  justify-content:space-between;
  padding:8px 10px 12px;
  font-size:13px;
  opacity:0.8;
}

/* ===== CARD ===== */
.card{
  background:white;
  margin:14px;
  padding:14px;
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

input,textarea,select{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:1px solid #eee;
}

/* ===== BUTTON ===== */
button{
  border:none;
  border-radius:12px;
  padding:12px;
  font-weight:600;
  cursor:pointer;
}

.primary{
  background:var(--burnt);
  color:white;
}

/* ===== NAV ===== */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -6px 18px rgba(0,0,0,0.08);
}

.nav-item{
  font-size:12px;
  color:#777;
  text-align:center;
  cursor:pointer;
}

.nav-item.active{
  color:var(--burnt);
  font-weight:600;
}

/* ===== FAB ===== */
.fab{
  position:fixed;
  bottom:90px;
  right:18px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--burnt);
  color:white;
  font-size:30px;
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  cursor:pointer;
}

</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <div>
    <div class="logo">🍳</div>
    <h2>Maggie’s Cookbook</h2>
    <p>Made with love by Adina 💛</p>
  </div>
</div>

<!-- HOME -->
<div id="home" class="view active">
  <div class="hero">
    <h1>🍳 Cookbook</h1>
  </div>
  <div id="grid" class="grid"></div>
</div>

<!-- ADD -->
<div id="add" class="view">
  <div class="card">
    <h3>Add Recipe</h3>

    <input id="name" placeholder="Meal name">

    <select id="tag">
      <option>Breakfast</option>
      <option>Lunch</option>
      <option>Dinner</option>
      <option>Dessert</option>
    </select>

    <textarea id="ingredients" placeholder="Ingredients"></textarea>
    <textarea id="recipe" placeholder="Recipe"></textarea>

    <input id="photo" type="file" accept="image/*">

    <button class="primary" onclick="saveMeal()">Save 💛</button>
  </div>
</div>

<!-- FAVORITES -->
<div id="fav" class="view">
  <div class="card">
    <h3>❤️ Favorites</h3>
    <div id="favGrid" class="grid"></div>
  </div>
</div>

<!-- RECEIVE -->
<div id="receive" class="view">
  <div class="card">
    <h3>📥 Receive Meals</h3>
    <p>Here you could import or sync meals later 💛</p>
    <div id="receiveGrid" class="grid"></div>
  </div>
</div>

<!-- FAB -->
<div class="fab" onclick="switchView('add')">+</div>

<!-- NAV -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchView('home')">🏠</div>
  <div class="nav-item" onclick="switchView('fav')">❤️</div>
  <div class="nav-item" onclick="switchView('receive')">📥</div>
</div>

<script>

let meals = JSON.parse(localStorage.getItem("maggiesCookbook")) || [];

function saveMeals(){
  localStorage.setItem("maggiesCookbook", JSON.stringify(meals));
}

/* SPLASH REMOVE */
setTimeout(()=>{
  document.getElementById("splash").remove();
},2200);

/* SWITCH */
function switchView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
}

/* SAVE */
function saveMeal(){
  const file=document.getElementById("photo").files[0];

  const meal={
    id:Date.now(),
    name:document.getElementById("name").value,
    tag:document.getElementById("tag").value,
    ingredients:document.getElementById("ingredients").value,
    recipe:document.getElementById("recipe").value,
    favorite:false
  };

  if(!meal.name) return alert("Add name");

  const finish=()=>{
    meals.unshift(meal);
    saveMeals();
    renderAll();
    switchView("home");
  };

  if(file){
    const r=new FileReader();
    r.onload=e=>{
      meal.photo=e.target.result;
      finish();
    };
    r.readAsDataURL(file);
  } else {
    meal.photo="";
    finish();
  }
}

/* TOGGLE FAVORITE */
function toggleFav(id){
  const m=meals.find(x=>x.id===id);
  m.favorite=!m.favorite;
  saveMeals();
  renderAll();
}

/* DELETE */
function deleteMeal(id){
  meals = meals.filter(m=>m.id!==id);
  saveMeals();
  renderAll();
}

/* HOME */
function renderHome(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";

  meals.forEach(m=>{
    grid.innerHTML+=`
      <div class="pin">
        ${m.photo?`<img src="${m.photo}">`:""}
        <div class="pin-title">${m.name}</div>
        <div class="pin-actions">
          <span onclick="toggleFav(${m.id})">${m.favorite?"❤️":"🤍"}</span>
          <span onclick="deleteMeal(${m.id})">🗑️</span>
        </div>
      </div>
    `;
  });
}

/* FAVORITES */
function renderFav(){
  const grid=document.getElementById("favGrid");
  grid.innerHTML="";

  meals.filter(m=>m.favorite).forEach(m=>{
    grid.innerHTML+=`
      <div class="pin">
        ${m.photo?`<img src="${m.photo}">`:""}
        <div class="pin-title">${m.name}</div>
      </div>
    `;
  });
}

/* RECEIVE */
function renderReceive(){
  const grid=document.getElementById("receiveGrid");
  grid.innerHTML="";

  grid.innerHTML = `<p style="grid-column:span 2;opacity:0.6;">
    (Future feature: sync meals between devices 💛)
  </p>`;
}

/* RENDER */
function renderAll(){
  renderHome();
  renderFav();
  renderReceive();
}

renderAll();

</script>

</body>
</html>
