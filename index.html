<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C65D2E">
<title>Maggie's Cookbook</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>
:root{
  --bg:#F8F2E7;
  --card:#ffffff;
  --text:#2d2a26;
  --muted:#7a736b;
  --accent:#C65D2E;
}

/* 🌙 DARK MODE */
body.dark{
  --bg:#1e1c1a;
  --card:#2a2623;
  --text:#f5f1ec;
  --muted:#b9b2aa;
}

body{
  margin:0;
  font-family:"Inter", sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:90px;
  transition:0.3s;
  overflow-x:hidden;
}

/* 🌿 BLOBS */
.bg-blobs{position:fixed;inset:0;z-index:-1;}
.blob{
  position:absolute;
  width:340px;
  height:340px;
  border-radius:50%;
  filter:blur(70px);
  opacity:0.2;
  animation:float 24s ease-in-out infinite;
}
.b1{background:#f2c6a0;top:-100px;left:-80px;}
.b2{background:#e8a87c;bottom:-120px;right:-90px;}
.b3{background:#f7d6bf;top:40%;left:60%;}

@keyframes float{
  0%{transform:translate(0,0);}
  50%{transform:translate(40px,-60px);}
  100%{transform:translate(0,0);}
}

/* HEADER */
.hero{
  background:linear-gradient(135deg,var(--accent),#e07b4f);
  color:white;
  padding:22px;
  text-align:center;
  border-radius:0 0 24px 24px;
  position:relative;
}

/* 🌙 TOGGLE SWITCH */
.switch{
  position:absolute;
  right:14px;
  top:14px;
  width:46px;
  height:26px;
}
.switch input{display:none;}
.slider{
  position:absolute;
  inset:0;
  background:rgba(255,255,255,0.35);
  border-radius:999px;
  cursor:pointer;
}
.slider:before{
  content:"";
  position:absolute;
  width:20px;
  height:20px;
  left:3px;
  top:3px;
  background:white;
  border-radius:50%;
  transition:0.3s;
}
.switch input:checked + .slider{
  background:#2b2a28;
}
.switch input:checked + .slider:before{
  transform:translateX(20px);
}

/* TITLE */
.section-title{
  padding:12px 14px 0;
  font-weight:600;
}

/* GRID */
.grid{
  column-count:2;
  column-gap:12px;
  padding:14px;
}

.pin{
  break-inside:avoid;
  margin-bottom:12px;
  background:var(--card);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
  cursor:pointer;
}

.pin img{width:100%;display:block;}

.pin-title{padding:10px;font-weight:600;}

.pin-meta{
  padding:0 10px 10px;
  font-size:12px;
  color:var(--muted);
}

/* INPUTS */
input,textarea,select{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:1px solid rgba(0,0,0,0.1);
}

/* BUTTONS */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:8px;
  cursor:pointer;
}

.primary{background:var(--accent);color:white;}
.secondary{background:#eee;}
.danger{background:#d64545;color:white;}

/* NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:78px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(14px);
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid rgba(0,0,0,0.05);
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:11px;
  gap:4px;
  color:var(--muted);
  cursor:pointer;
}

.nav-item i{
  width:22px;
  height:22px;
}

/* FAB */
.fab{
  position:fixed;
  bottom:95px;
  right:18px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--accent);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:22px;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  align-items:flex-end;
}

.modal-content{
  background:var(--card);
  width:100%;
  max-height:90%;
  border-radius:20px 20px 0 0;
  padding:16px;
  overflow:auto;
}
</style>
</head>

<body>

<!-- 🌿 BLOBS -->
<div class="bg-blobs">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<!-- HEADER -->
<div class="hero">
  <h1>Maggie's Cookbook</h1>
  <p>Made by Maggie. Taste-tested and approved by Adina ❤️</p>

  <!-- 🌙 toggle -->
  <label class="switch">
    <input type="checkbox" onchange="toggleDark(this)">
    <span class="slider"></span>
  </label>
</div>

<!-- HOME -->
<div id="home">
  <div class="section-title">🍽 My Meals</div>
  <div id="grid" class="grid"></div>
</div>

<!-- ADD -->
<div id="add" style="display:none;padding:14px;">
  <h2>Add Recipe</h2>

  <input id="name" placeholder="Name">

  <p>Rating</p>
  <div id="stars"></div>

  <input id="lastCooked" type="date">
  <input id="ingredients" placeholder="Ingredients">

  <select id="likedBy">
    <option>Both</option>
    <option>Adina</option>
    <option>Maggie</option>
  </select>

  <textarea id="recipe" placeholder="Recipe"></textarea>
  <input type="file" id="photo">

  <button class="primary" onclick="saveMeal()">Save</button>
</div>

<!-- FAB -->
<div class="fab" onclick="showAdd()">+</div>

<!-- 🧭 TASKBAR (RESTORED + FAVORITES) -->
<div class="bottom-nav">

  <div class="nav-item" onclick="showHome()">
    <i data-lucide="home"></i>
    <span>Home</span>
  </div>

  <div class="nav-item" onclick="showFav()">
    <i data-lucide="heart"></i>
    <span>Favorites</span>
  </div>

  <div class="nav-item" onclick="exportData()">
    <i data-lucide="download"></i>
    <span>Backup</span>
  </div>

</div>

<!-- MODAL -->
<div class="modal" id="view">
  <div class="modal-content" id="viewContent"></div>
</div>

<script>

let meals = JSON.parse(localStorage.getItem("cookbook")) || [];
let selected=null;
let rating=5;

/* SAVE */
function saveMeals(){
  localStorage.setItem("cookbook", JSON.stringify(meals));
}

/* 🌙 DARK MODE */
function toggleDark(el){
  document.body.classList.toggle("dark", el.checked);
}

/* NAV */
function showHome(){
  document.getElementById("home").style.display="block";
  document.getElementById("add").style.display="none";
  renderHome();
}

function showFav(){
  const fav = meals.filter(m=>m.favorite);
  const grid=document.getElementById("grid");

  grid.innerHTML="";

  fav.forEach(m=>{
    grid.innerHTML+=`
      <div class="pin" onclick="openMeal(${m.id})">
        ${m.photo?`<img src="${m.photo}">`:""}
        <div class="pin-title">${m.name}</div>
        <div class="pin-meta">❤️ Favorite</div>
      </div>
    `;
  });

  document.getElementById("home").style.display="block";
  document.getElementById("add").style.display="none";
}

function showAdd(){
  document.getElementById("home").style.display="none";
  document.getElementById("add").style.display="block";
  renderStars();
}

/* ⭐ STARS */
function renderStars(){
  const el=document.getElementById("stars");
  el.innerHTML="";
  for(let i=1;i<=5;i++){
    const s=document.createElement("span");
    s.innerHTML=i<=rating?"⭐":"☆";
    s.style.fontSize="22px";
    s.style.cursor="pointer";
    s.onclick=()=>{rating=i;renderStars();};
    el.appendChild(s);
  }
}

/* SAVE */
function saveMeal(){
  const file=document.getElementById("photo").files[0];

  const meal={
    id:Date.now(),
    name:document.getElementById("name").value,
    ingredients:document.getElementById("ingredients").value,
    recipe:document.getElementById("recipe").value,
    likedBy:document.getElementById("likedBy").value,
    lastCooked:document.getElementById("lastCooked").value,
    rating:rating,
    favorite:false
  };

  const finish=()=>{
    meals.unshift(meal);
    saveMeals();
    showHome();
  };

  if(file){
    const r=new FileReader();
    r.onload=e=>{meal.photo=e.target.result;finish();};
    r.readAsDataURL(file);
  } else finish();
}

/* HOME */
function renderHome(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";

  meals.forEach(m=>{
    grid.innerHTML+=`
      <div class="pin" onclick="openMeal(${m.id})">
        ${m.photo?`<img src="${m.photo}">`:""}
        <div class="pin-title">${m.name}</div>
        <div class="pin-meta">
          ❤️ ${m.likedBy}<br>
          ⭐ ${m.rating}/5<br>
          📅 ${m.lastCooked||""}
        </div>
      </div>
    `;
  });

  lucide.createIcons();
}

/* OPEN */
function openMeal(id){
  selected=meals.find(m=>m.id===id);

  document.getElementById("viewContent").innerHTML=`
    <h2>${selected.name}</h2>

    ${selected.photo?`<img src="${selected.photo}" style="width:100%;border-radius:12px;">`:""}

    <p><b>Ingredients:</b><br>${selected.ingredients}</p>
    <p><b>Recipe:</b><br>${selected.recipe}</p>

    <p><b>Rating:</b> ⭐ ${selected.rating}</p>

    <button class="danger" onclick="deleteMeal()">Delete</button>
    <button onclick="closeView()">Close</button>
  `;

  document.getElementById("view").style.display="flex";
}

function closeView(){
  document.getElementById("view").style.display="none";
}

/* DELETE */
function deleteMeal(){
  if(!confirm("Delete?")) return;
  meals=meals.filter(m=>m.id!==selected.id);
  saveMeals();
  renderHome();
  closeView();
}

/* BACKUP */
function exportData(){
  const blob=new Blob([JSON.stringify(meals)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="cookbook.json";
  a.click();
}

/* INIT */
renderStars();
renderHome();

</script>

</body>
</html>
