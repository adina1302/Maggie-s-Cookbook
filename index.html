<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C65D2E">
<title>Maggie's Cookbook</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root{
  --bg:#F8F2E7;
  --card:#fff;
  --text:#2d2a26;
  --muted:#7a736b;
  --accent:#C65D2E;
}

body{
  margin:0;
  font-family:"Inter", sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:80px;
}

/* HEADER */
.hero{
  background:linear-gradient(135deg,var(--accent),#e07b4f);
  color:white;
  padding:26px;
  text-align:center;
  border-radius:0 0 24px 24px;
}

/* PINTEREST */
.grid{
  column-count:2;
  column-gap:12px;
  padding:14px;
}

.pin{
  break-inside:avoid;
  margin-bottom:12px;
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
  cursor:pointer;
  transition:0.2s;
}

.pin:active{transform:scale(0.98);}

.pin img{
  width:100%;
  display:block;
}

.pin-title{
  padding:10px;
  font-weight:600;
}

.pin-meta{
  padding:0 10px 10px;
  font-size:12px;
  color:var(--muted);
}

/* NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:rgba(255,255,255,0.9);
  backdrop-filter:blur(12px);
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -6px 20px rgba(0,0,0,0.08);
}

.nav-item{
  color:var(--muted);
  cursor:pointer;
}

.nav-item.active{
  color:var(--accent);
}

/* FAB */
.fab{
  position:fixed;
  bottom:90px;
  right:18px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--accent);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}

/* MODAL BACKDROP */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modal-content{
  background:white;
  width:100%;
  max-height:90%;
  border-radius:20px 20px 0 0;
  padding:16px;
  overflow:auto;
  animation:slideUp 0.25s ease;
}

@keyframes slideUp{
  from{transform:translateY(30px); opacity:0;}
  to{transform:translateY(0); opacity:1;}
}

button{
  border:none;
  padding:12px;
  border-radius:12px;
  cursor:pointer;
  width:100%;
  margin-top:8px;
}

.primary{background:var(--accent);color:white;}
.danger{background:#d64545;color:white;}
.secondary{background:#eee;}
</style>
</head>

<body>

<div class="hero">
  <h1>Maggie's Cookbook</h1>
  <p>Made by Maggie. Taste-tested and approved by Adina ❤️</p>
</div>

<!-- HOME -->
<div id="home">
  <div id="grid" class="grid"></div>
</div>

<!-- FAB -->
<div class="fab" onclick="openAdd()">
  <i data-lucide="plus"></i>
</div>

<!-- NAV -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="showHome()"><i data-lucide="home"></i></div>
  <div class="nav-item" onclick="showFav()"><i data-lucide="heart"></i></div>
  <div class="nav-item" onclick="exportData()"><i data-lucide="download"></i></div>
</div>

<!-- ADD MODAL -->
<div class="modal" id="addModal">
  <div class="modal-content">
    <h3>Add Recipe</h3>

    <input id="name" placeholder="Name">
    <input id="ingredients" placeholder="Ingredients">
    <input id="lastCooked" type="date">

    <select id="likedBy">
      <option>Both</option>
      <option>Adina</option>
      <option>Maggie</option>
    </select>

    <textarea id="recipe" placeholder="Recipe"></textarea>
    <input type="file" id="photo">

    <button class="primary" onclick="saveMeal()">Save</button>
    <button class="secondary" onclick="closeAdd()">Close</button>
  </div>
</div>

<!-- RECIPE VIEW MODAL -->
<div class="modal" id="viewModal">
  <div class="modal-content" id="viewContent"></div>
</div>

<script>

let meals = JSON.parse(localStorage.getItem("cookbook")) || [];
let selected = null;

function saveMeals(){
  localStorage.setItem("cookbook", JSON.stringify(meals));
}

/* HOME */
function showHome(){
  renderHome();
}

/* FAVORITES */
function showFav(){
  const fav = meals.filter(m=>m.favorite);
  renderList(fav);
}

/* RENDER */
function renderHome(){
  renderList(meals);
}

function renderList(list){
  const grid=document.getElementById("grid");
  grid.innerHTML="";

  list.forEach(m=>{
    grid.innerHTML+=`
      <div class="pin" onclick="openMeal(${m.id})">
        ${m.photo?`<img src="${m.photo}">`:""}
        <div class="pin-title">${m.name}</div>
        <div class="pin-meta">❤️ ${m.likedBy}</div>
      </div>
    `;
  });

  lucide.createIcons();
}

/* OPEN ADD */
function openAdd(){
  document.getElementById("addModal").style.display="flex";
}

function closeAdd(){
  document.getElementById("addModal").style.display="none";
}

/* SAVE */
function saveMeal(){
  const file=document.getElementById("photo").files[0];

  const meal={
    id:Date.now(),
    name:document.getElementById("name").value,
    ingredients:document.getElementById("ingredients").value,
    recipe:document.getElementById("recipe").value,
    likedBy:document.getElementById("likedBy").value,
    lastCooked:document.getElementById("lastCooked").value,
    favorite:false
  };

  const finish=()=>{
    meals.unshift(meal);
    saveMeals();
    closeAdd();
    renderHome();
  };

  if(file){
    const r=new FileReader();
    r.onload=e=>{meal.photo=e.target.result; finish();};
    r.readAsDataURL(file);
  } else {
    finish();
  }
}

/* VIEW RECIPE */
function openMeal(id){
  const m=meals.find(x=>x.id===id);

  selected = m;

  document.getElementById("viewContent").innerHTML=`
    <h2>${m.name}</h2>
    ${m.photo?`<img src="${m.photo}" style="width:100%;border-radius:12px;">`:""}

    <p><b>Ingredients:</b><br>${m.ingredients}</p>
    <p><b>Recipe:</b><br>${m.recipe}</p>
    <p><b>Liked by:</b> ${m.likedBy}</p>
    <p><b>Last cooked:</b> ${m.lastCooked}</p>

    <button class="primary" onclick="toggleFav()">❤️ Favorite</button>
    <button class="secondary" onclick="editMeal()">✏️ Edit</button>
    <button class="danger" onclick="deleteMeal()">🗑️ Delete</button>
    <button class="secondary" onclick="closeView()">Close</button>
  `;

  document.getElementById("viewModal").style.display="flex";
}

/* CLOSE VIEW */
function closeView(){
  document.getElementById("viewModal").style.display="none";
}

/* FAVORITE */
function toggleFav(){
  selected.favorite=!selected.favorite;
  saveMeals();
  renderHome();
  closeView();
}

/* DELETE */
function deleteMeal(){
  if(!confirm("Delete this recipe?")) return;
  meals = meals.filter(m=>m.id!==selected.id);
  saveMeals();
  renderHome();
  closeView();
}

/* EDIT (simple reopen) */
function editMeal(){
  document.getElementById("name").value=selected.name;
  document.getElementById("ingredients").value=selected.ingredients;
  document.getElementById("recipe").value=selected.recipe;
  document.getElementById("likedBy").value=selected.likedBy;
  document.getElementById("lastCooked").value=selected.lastCooked;

  deleteMeal();
  closeView();
  openAdd();
}

/* BACKUP */
function exportData(){
  const blob=new Blob([JSON.stringify(meals)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="cookbook.json";
  a.click();
}

/* INIT */
renderHome();
lucide.createIcons();

</script>

</body>
</html>
