<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C65D2E">
<title>Maggie's Cookbook</title>

<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="icon.png">

<style>
:root{
  --burnt:#C65D2E;
  --cream:#F8F2E7;
  --sage:#A7B89A;
  --text:#4A3428;
  --card:#FFFFFF;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--cream);
  color:var(--text);
  padding-bottom:80px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.hero{
  background:linear-gradient(135deg,var(--burnt),#d97a4d);
  color:white;
  padding:24px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.12);
}

.card{
  background:var(--card);
  border-radius:20px;
  padding:16px;
  margin-top:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

input,textarea,select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #ddd;
  margin-top:8px;
  margin-bottom:10px;
}

button{
  border:none;
  border-radius:14px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:600;
}

.primary{background:var(--burnt);color:white;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:14px;
}

.meal-img{
  width:100%;
  border-radius:14px;
  margin-top:10px;
  max-height:300px;
  object-fit:cover;
}

.tag{
  display:inline-block;
  background:var(--sage);
  color:white;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
}

.favorite{font-size:22px;cursor:pointer;}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -4px 12px rgba(0,0,0,.1);
  border-top-left-radius:20px;
  border-top-right-radius:20px;
}

.nav-item{
  text-align:center;
  font-size:12px;
  cursor:pointer;
  color:#666;
}

.nav-item.active{
  color:var(--burnt);
  font-weight:700;
}

.view{display:none;}
.view.active{display:block;}

.favorite-glow{
  box-shadow:0 6px 20px rgba(198,93,46,0.25);
}

</style>
</head>

<body>

<div class="container">

  <!-- HOME VIEW -->
  <div id="home" class="view active">

    <div class="hero">
      <h1>🍳 Maggie's Cookbook</h1>
      <p>Made by Maggie. Taste-tested and approved by Adina ❤️</p>
    </div>

    <div class="card">
      <input id="search" placeholder="🔍 Search meals..." oninput="renderMeals()">
    </div>

    <div id="meals" class="grid"></div>
  </div>

  <!-- ADD VIEW -->
  <div id="add" class="view">
    <div class="card">
      <h2>➕ Add Recipe</h2>

      <input id="name" placeholder="Meal name">

      <select id="tag">
        <option>Breakfast</option>
        <option>Lunch</option>
        <option>Dinner</option>
        <option>Dessert</option>
      </select>

      <textarea id="ingredients" placeholder="🥕 Ingredients"></textarea>
      <textarea id="recipe" placeholder="👩‍🍳 Recipe"></textarea>

      <input id="photo" type="file" accept="image/*">

      <button class="primary" onclick="saveMeal()">Save 💛</button>
    </div>
  </div>

  <!-- FAVORITES VIEW -->
  <div id="fav" class="view">
    <div class="card">
      <h2>❤️ Favorites</h2>
      <div id="favList" class="grid"></div>
    </div>
  </div>

  <!-- SURPRISE VIEW -->
  <div id="surprise" class="view">
    <div class="card">
      <button class="primary" onclick="randomMeal()">🎲 Pick for me</button>
      <div id="randomBox"></div>
    </div>
  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchView('home')">🏠<br>Home</div>
  <div class="nav-item" onclick="switchView('add')">➕<br>Add</div>
  <div class="nav-item" onclick="switchView('surprise')">🎲<br>Surprise</div>
  <div class="nav-item" onclick="switchView('fav')">❤️<br>Favs</div>
</div>

<script>

let meals = JSON.parse(localStorage.getItem("maggiesCookbook")) || [];

/* save */
function saveMeals(){
  localStorage.setItem("maggiesCookbook", JSON.stringify(meals));
}

/* switch tabs */
function switchView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  event.target.classList.add("active");

  if(id==="fav") renderFav();
  if(id==="home") renderMeals();
}

/* save meal */
function saveMeal(){
  const file=document.getElementById("photo").files[0];

  const meal={
    name:document.getElementById("name").value,
    tag:document.getElementById("tag").value,
    ingredients:document.getElementById("ingredients").value,
    recipe:document.getElementById("recipe").value,
    favorite:false
  };

  if(!meal.name) return alert("Add name");

  const finish=()=>{
    meals.unshift(meal);
    saveMeals();
    alert("Saved 💛");
  };

  if(file){
    const r=new FileReader();
    r.onload=e=>{meal.photo=e.target.result;finish();}
    r.readAsDataURL(file);
  } else {
    meal.photo="";
    finish();
  }
}

/* render meals */
function renderMeals(){
  const box=document.getElementById("meals");
  const q=document.getElementById("search")?.value?.toLowerCase()||"";

  box.innerHTML="";

  meals.forEach(m=>{
    if(!m.name.toLowerCase().includes(q)) return;

    box.innerHTML+=`
      <div class="card ${m.favorite?"favorite-glow":""}">
        <div style="display:flex;justify-content:space-between;">
          <h3>${m.name}</h3>
          <span onclick="toggleFav('${m.name}')">${m.favorite?"❤️":"🤍"}</span>
        </div>

        ${m.photo?`<img class="meal-img" src="${m.photo}">`:""}

        <p>${m.tag}</p>
        <p>${m.ingredients}</p>
        <p>${m.recipe}</p>
      </div>
    `;
  });
}

/* fav */
function toggleFav(name){
  const m=meals.find(x=>x.name===name);
  m.favorite=!m.favorite;
  saveMeals();
  renderMeals();
}

/* favorites */
function renderFav(){
  const box=document.getElementById("favList");
  box.innerHTML="";

  meals.filter(m=>m.favorite).forEach(m=>{
    box.innerHTML+=`
      <div class="card">
        <h3>${m.name}</h3>
        ${m.photo?`<img class="meal-img" src="${m.photo}">`:""}
      </div>
    `;
  });
}

/* random */
function randomMeal(){
  const box=document.getElementById("randomBox");
  if(!meals.length) return;

  const m=meals[Math.floor(Math.random()*meals.length)];

  box.innerHTML=`
    <div class="card">
      <h3>🎲 ${m.name}</h3>
      ${m.photo?`<img class="meal-img" src="${m.photo}">`:""}
    </div>
  `;
}

renderMeals();

</script>

</body>
</html>
