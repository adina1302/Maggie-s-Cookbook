<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C65D2E">
<title>Maggie's Cookbook</title>

<style>
:root{
  --burnt:#C65D2E;
  --cream:#F8F2E7;
  --sage:#A7B89A;
  --text:#4A3428;
  --card:#FFFFFF;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--cream);
  color:var(--text);
}

.container{max-width:900px;margin:auto;padding:18px;}

.hero{
  background:linear-gradient(135deg,var(--burnt),#d97a4d);
  color:white;
  padding:24px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.12);
}

.subtitle{opacity:.95;margin-top:8px}

.card{
  background:var(--card);
  border-radius:20px;
  padding:16px;
  margin-top:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

input,textarea,select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #ddd;
  margin-top:8px;
  margin-bottom:10px;
}

button{
  border:none;
  border-radius:14px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:600;
}

.primary{background:var(--burnt);color:white;}
.secondary{background:var(--sage);color:white;}

.meal-img{
  width:100%;
  border-radius:14px;
  margin-top:10px;
  max-height:300px;
  object-fit:cover;
}

.tag{
  display:inline-block;
  background:var(--sage);
  color:white;
  padding:4px 10px;
  border-radius:999px;
  margin-right:6px;
  font-size:12px;
}

.favorite{
  font-size:22px;
  cursor:pointer;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:14px;
}

.star{
  font-size:26px;
  cursor:pointer;
  user-select:none;
}
</style>
</head>

<body>

<div class="container">

  <div class="hero">
    <h1>🍳 Maggie's Cookbook</h1>
    <p class="subtitle">
      Made by Maggie. Taste-tested and enthusiastically approved by Adina ❤️
    </p>
  </div>

  <!-- SEARCH + RANDOM -->
  <div class="card">
    <input id="search" placeholder="🔍 Search meals..." oninput="renderMeals()">

    <button class="primary" onclick="randomMeal()">
      🎲 What should I cook today?
    </button>

    <div id="randomBox"></div>
  </div>

  <!-- ADD MEAL -->
  <div class="card">
    <h2>Add a Meal 💛</h2>

    <input id="name" placeholder="Meal name">

    <select id="tag">
      <option>Breakfast</option>
      <option>Lunch</option>
      <option>Dinner</option>
      <option>Dessert</option>
    </select>

    <!-- STAR RATING -->
    <p>Rating</p>
    <div id="stars" class="star">★★★★★</div>

    <input id="date" type="date">

    <textarea id="ingredients" placeholder="🥕 Ingredients"></textarea>

    <textarea id="recipe" placeholder="Recipe"></textarea>

    <input id="photo" type="file" accept="image/*">

    <button class="primary" onclick="saveMeal()">Save Meal</button>
  </div>

  <!-- MEALS -->
  <div id="meals" class="grid"></div>

</div>

<script>

let meals = JSON.parse(localStorage.getItem("maggiesCookbook")) || [];
let selectedRating = 5;

function saveMeals(){
  localStorage.setItem("maggiesCookbook", JSON.stringify(meals));
}

/* ⭐ STAR SYSTEM */
function setupStars(){
  const stars = document.getElementById("stars");

  function render(n){
    stars.innerHTML = "★★★★★"
      .split("")
      .map((s,i)=> i < n ? "★" : "☆")
      .join("");
  }

  render(selectedRating);

  stars.onclick = (e)=>{
    const rect = stars.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const starWidth = rect.width / 5;
    selectedRating = Math.max(1, Math.ceil(x / starWidth));
    render(selectedRating);
  };
}

setupStars();

/* SAVE */
function saveMeal(){

  const file = document.getElementById("photo").files[0];

  const mealData = {
    name: document.getElementById("name").value.trim(),
    tag: document.getElementById("tag").value,
    rating: selectedRating,
    date: document.getElementById("date").value,
    ingredients: document.getElementById("ingredients").value,
    recipe: document.getElementById("recipe").value,
    favorite:false
  };

  if(!mealData.name){
    alert("Please enter a meal name.");
    return;
  }

  const saveAndRender = () => {
    meals.unshift(mealData);
    saveMeals();
    renderMeals();

    document.getElementById("name").value = "";
    document.getElementById("ingredients").value = "";
    document.getElementById("recipe").value = "";
    document.getElementById("date").value = "";
    document.getElementById("photo").value = "";
    document.getElementById("tag").selectedIndex = 0;

    selectedRating = 5;
    setupStars();
  };

  if(file){
    const reader = new FileReader();
    reader.onload = e=>{
      mealData.photo = e.target.result;
      saveAndRender();
    };
    reader.readAsDataURL(file);
  } else {
    mealData.photo = "";
    saveAndRender();
  }
}

/* FAVORITES */
function toggleFavorite(name){
  const meal = meals.find(m => m.name === name);
  if(!meal) return;

  meal.favorite = !meal.favorite;
  saveMeals();
  renderMeals();
}

/* RANDOM */
function randomMeal(){

  const box = document.getElementById("randomBox");

  if(meals.length === 0){
    box.innerHTML = "<p>Add some meals first!</p>";
    return;
  }

  const meal = meals[Math.floor(Math.random() * meals.length)];

  box.innerHTML = `
    <div class="card">
      <h3>🎲 Tonight's Pick: ${meal.name}</h3>
      ${meal.photo ? `<img class="meal-img" src="${meal.photo}">` : ""}
      <p><span class="tag">${meal.tag}</span></p>
      <p>${"⭐".repeat(Number(meal.rating || 0))}</p>
    </div>
  `;
}

/* RENDER + FAVORITES FIRST */
function renderMeals(){

  const searchText = document.getElementById("search").value.toLowerCase();
  const mealsContainer = document.getElementById("meals");

  mealsContainer.innerHTML = "";

  if(meals.length === 0){
    mealsContainer.innerHTML = `
      <div class="card">
        <h3>🍝 No meals yet</h3>
        <p>Add your first dish to start your cookbook 💛</p>
      </div>
    `;
    return;
  }

  const sortedMeals = [...meals].sort((a,b)=> (b.favorite === true) - (a.favorite === true));

  sortedMeals.forEach((meal)=>{

    if(
      !meal.name.toLowerCase().includes(searchText) &&
      !meal.tag.toLowerCase().includes(searchText)
    ){
      return;
    }

    mealsContainer.innerHTML += `
      <div class="card">

        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h3>${meal.name}</h3>

          <span class="favorite" onclick="toggleFavorite('${meal.name}')">
            ${meal.favorite ? "❤️" : "🤍"}
          </span>
        </div>

        ${meal.photo ? `<img class="meal-img" src="${meal.photo}">` : ""}

        <p><span class="tag">${meal.tag}</span></p>

        <p>${"⭐".repeat(Number(meal.rating || 0))}</p>

        <p><strong>Last cooked:</strong> ${meal.date || "Unknown"}</p>

        <p><strong>Ingredients 🥕</strong><br>${meal.ingredients || ""}</p>

        <p><strong>Recipe</strong><br>${meal.recipe || ""}</p>

      </div>
    `;
  });
}

renderMeals();

</script>

</body>
</html>
