<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C65D2E">
<title>Maggie's Cookbook</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --burnt:#C65D2E;
  --cream:#F8F2E7;
  --text:#3E2C22;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  background:var(--cream);
  color:var(--text);
  padding-bottom:90px;
}

/* SPLASH */
#splash{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#C65D2E,#e07b4f);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  color:white;
  text-align:center;
  animation:fadeOut 0.6s ease forwards;
  animation-delay:2.2s;
}

.logo{
  font-size:54px;
  animation:float 1.6s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
}

@keyframes fadeOut{
  to{opacity:0;visibility:hidden;}
}

/* HERO */
.hero{
  background:linear-gradient(135deg,#C65D2E,#e07b4f);
  color:white;
  padding:26px;
  text-align:center;
  border-radius:0 0 24px 24px;
}

.hero h1{
  margin:0;
  font-size:24px;
}

.hero p{
  margin-top:6px;
  font-size:13px;
  opacity:0.9;
}

/* CARD */
.card{
  background:white;
  margin:14px;
  padding:14px;
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

input,textarea,select{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:1px solid #eee;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}

.pin{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

.pin img{
  width:100%;
  height:140px;
  object-fit:cover;
}

.pin-title{
  padding:10px;
  font-weight:600;
  font-size:14px;
}

/* ACTIONS */
.pin-actions{
  display:flex;
  justify-content:space-between;
  padding:8px 10px 12px;
  font-size:14px;
  cursor:pointer;
}

/* BUTTON */
button{
  border:none;
  border-radius:12px;
  padding:12px;
  font-weight:600;
  cursor:pointer;
}

.primary{
  background:#C65D2E;
  color:white;
}

/* NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -6px 18px rgba(0,0,0,0.08);
}

.nav-item{
  font-size:12px;
  color:#777;
}

.nav-item.active{
  color:#C65D2E;
  font-weight:600;
}

/* FAB */
.fab{
  position:fixed;
  bottom:90px;
  right:18px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:#C65D2E;
  color:white;
  font-size:30px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}

</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <div>
    <div class="logo">🍳</div>
    <h2>Maggie's Cookbook</h2>
    <p>Made with love by Adina 💛</p>
  </div>
</div>

<!-- HOME -->
<div id="home" class="view active">

  <div class="hero">
    <h1>🍳 Maggie's Cookbook</h1>
    <p>Made by Maggie. Taste-tested and approved by Adina ❤️</p>
  </div>

  <!-- 🔍 INGREDIENT SEARCH -->
  <div class="card">
    <input id="ingredientSearch"
           placeholder="🥕 What ingredients do you have?"
           oninput="renderHome()">
  </div>

  <div id="grid" class="grid"></div>
</div>

<!-- ADD -->
<div id="add" class="view">
  <div class="card">
    <h3>Add Recipe</h3>

    <input id="name" placeholder="Meal name">
    <input id="ingredients" placeholder="Ingredients (comma separated)">

    <select id="tag">
      <option>Breakfast</option>
      <option>Lunch</option>
      <option>Dinner</option>
      <option>Dessert</option>
    </select>

    <textarea id="recipe" placeholder="Recipe"></textarea>
    <input id="photo" type="file" accept="image/*">

    <button class="primary" onclick="saveMeal()">Save 💛</button>
  </div>
</div>

<!-- FAVORITES -->
<div id="fav" class="view">
  <div class="card">
    <h3>❤️ Favorites</h3>
    <div id="favGrid" class="grid"></div>
  </div>
</div>

<!-- NAV -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchView('home')">🏠</div>
  <div class="nav-item" onclick="switchView('fav')">❤️</div>
  <div class="nav-item" onclick="switchView('add')">➕</div>
</div>

<!-- FAB -->
<div class="fab" onclick="switchView('add')">+</div>

<script>

let meals = JSON.parse(localStorage.getItem("maggiesCookbook")) || [];
let editId = null;

/* SAVE */
function saveMeals(){
  localStorage.setItem("maggiesCookbook", JSON.stringify(meals));
}

/* SPLASH */
setTimeout(()=>{
  document.getElementById("splash").remove();
},2200);

/* VIEW SWITCH */
function switchView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* SAVE / EDIT */
function saveMeal(){
  const file = document.getElementById("photo").files[0];

  const meal = {
    id: editId || Date.now(),
    name: document.getElementById("name").value,
    ingredients: document.getElementById("ingredients").value,
    tag: document.getElementById("tag").value,
    recipe: document.getElementById("recipe").value,
    favorite:false
  };

  if(!meal.name) return alert("Add a name 💛");

  const finish=()=>{
    if(editId){
      meals = meals.filter(m=>m.id !== editId);
    }

    meals.unshift(meal);
    saveMeals();

    editId=null;
    renderHome();
    switchView("home");
  };

  if(file){
    const r=new FileReader();
    r.onload=e=>{
      meal.photo=e.target.result;
      finish();
    };
    r.readAsDataURL(file);
  } else {
    meal.photo="";
    finish();
  }
}

/* DELETE */
function deleteMeal(id){
  if(!confirm("Delete this recipe? 💔")) return;
  meals = meals.filter(m=>m.id !== id);
  saveMeals();
  renderHome();
}

/* FAVORITE */
function toggleFav(id){
  const m = meals.find(x=>x.id===id);
  m.favorite = !m.favorite;
  saveMeals();
  renderHome();
  renderFav();
}

/* EDIT */
function editMeal(id){
  const m = meals.find(x=>x.id===id);

  document.getElementById("name").value = m.name;
  document.getElementById("ingredients").value = m.ingredients;
  document.getElementById("tag").value = m.tag;
  document.getElementById("recipe").value = m.recipe;

  editId = id;
  switchView("add");
}

/* 🧠 SMART INGREDIENT MATCHING */
function renderHome(){

  const grid = document.getElementById("grid");
  const query = document.getElementById("ingredientSearch").value.toLowerCase();

  const searchIngredients = query
    .split(",")
    .map(i => i.trim())
    .filter(Boolean);

  let sorted = meals.map(m => {

    let score = 0;

    searchIngredients.forEach(ing => {
      if(m.ingredients?.toLowerCase().includes(ing)) score += 2;
      if(m.name?.toLowerCase().includes(ing)) score += 1;
    });

    return {...m, score};
  });

  sorted.sort((a,b)=>b.score - a.score);

  grid.innerHTML = "";

  sorted.forEach(m=>{
    grid.innerHTML += `
      <div class="pin" style="opacity:${query && m.score===0 ? 0.4 : 1}">

        ${m.photo ? `<img src="${m.photo}">` : ""}

        <div class="pin-title">${m.name}</div>

        <div class="pin-actions">
          <span onclick="toggleFav(${m.id})">${m.favorite?"❤️":"🤍"}</span>
          <span onclick="editMeal(${m.id})">✏️</span>
          <span onclick="deleteMeal(${m.id})">🗑️</span>
        </div>

      </div>
    `;
  });
}

/* FAVORITES */
function renderFav(){
  const grid = document.getElementById("favGrid");
  grid.innerHTML = "";

  meals.filter(m=>m.favorite).forEach(m=>{
    grid.innerHTML += `
      <div class="pin">
        ${m.photo ? `<img src="${m.photo}">` : ""}
        <div class="pin-title">${m.name}</div>
      </div>
    `;
  });
}

/* INIT */
renderHome();
renderFav();

</script>

</body>
</html>
