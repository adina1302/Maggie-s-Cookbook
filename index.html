<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C65D2E">
<title>Maggie's Cookbook</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/lucide@latest"></script>

<link rel="manifest" href="manifest.json">

<style>
:root{
  --bg:#F8F2E7;
  --card:#fff;
  --text:#2d2a26;
  --muted:#7a736b;
  --accent:#C65D2E;
}

body{
  margin:0;
  font-family:"Inter", -apple-system, sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:90px;
}

/* HERO */
.hero{
  background:linear-gradient(135deg,var(--accent),#e07b4f);
  color:white;
  padding:26px;
  text-align:center;
  border-radius:0 0 24px 24px;
}

.hero h1{margin:0;font-size:22px;}
.hero p{margin-top:6px;font-size:13px;opacity:0.9}

/* INPUT */
.card{
  background:var(--card);
  margin:14px;
  padding:14px;
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

input,textarea,select{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:1px solid rgba(0,0,0,0.1);
}

/* PINTEREST GRID */
.grid{
  column-count:2;
  column-gap:12px;
  padding:12px;
}

.pin{
  break-inside:avoid;
  margin-bottom:12px;
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 6px 16px rgba(0,0,0,0.08);
}

.pin img{
  width:100%;
  display:block;
}

.pin-title{
  padding:10px;
  font-weight:600;
}

.pin-actions{
  display:flex;
  justify-content:space-between;
  padding:0 10px 12px;
  font-size:14px;
  cursor:pointer;
}

/* NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -6px 20px rgba(0,0,0,0.08);
}

.nav-item{
  color:var(--muted);
  cursor:pointer;
}

.nav-item.active{
  color:var(--accent);
}

/* FAB */
.fab{
  position:fixed;
  bottom:90px;
  right:18px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--accent);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- HERO (UNCHANGED PERSONAL MESSAGE) -->
<div class="hero">
  <h1>Maggie's Cookbook</h1>
  <p>Made by Maggie. Taste-tested and approved by Adina ❤️</p>
</div>

<!-- SEARCH -->
<div class="card">
  <input id="ingredientSearch"
         placeholder="What ingredients do you have?"
         oninput="renderHome()">
</div>

<!-- HOME (PINTEREST STYLE) -->
<div id="home" class="view active">
  <div id="grid" class="grid"></div>
</div>

<!-- ADD -->
<div id="add" class="view">
  <div class="card">
    <h3>Add Recipe</h3>

    <input id="name" placeholder="Meal name">
    <input id="ingredients" placeholder="Ingredients">

    <select id="favFor">
      <option>Both</option>
      <option>Adina</option>
      <option>Maggie</option>
    </select>

    <textarea id="recipe" placeholder="Recipe"></textarea>
    <input id="photo" type="file" accept="image/*">

    <button onclick="saveMeal()" style="background:#C65D2E;color:white;width:100%;padding:12px;border:none;border-radius:12px;">
      Save
    </button>
  </div>
</div>

<!-- FAVORITES -->
<div id="fav" class="view">
  <div class="card">
    <h3>Favorites</h3>
    <div id="favGrid" class="grid"></div>
  </div>
</div>

<!-- BACKUP (NOW IN TASKBAR STYLE AREA) -->
<div id="backup" class="view">
  <div class="card">
    <h3>Backup</h3>

    <button onclick="exportData()" style="width:100%;padding:12px;border:none;border-radius:12px;background:#C65D2E;color:white;">
      Download Backup
    </button>

    <input type="file" accept=".json" onchange="importData(event)">
  </div>
</div>

<!-- FLOATING BUTTON (ONLY ADD BUTTON NOW) -->
<div class="fab" onclick="switchView('add')">
  <i data-lucide="plus"></i>
</div>

<!-- NAV -->
<div class="bottom-nav">
  <div onclick="switchView('home')" class="nav-item"><i data-lucide="home"></i></div>
  <div onclick="switchView('fav')" class="nav-item"><i data-lucide="heart"></i></div>
  <div onclick="switchView('backup')" class="nav-item"><i data-lucide="download"></i></div>
</div>

<script>

let meals = JSON.parse(localStorage.getItem("cookbook")) || [];

/* SAVE */
function saveMeals(){
  localStorage.setItem("cookbook", JSON.stringify(meals));
}

/* SWITCH */
function switchView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* SAVE MEAL */
function saveMeal(){
  const file=document.getElementById("photo").files[0];

  const meal={
    id:Date.now(),
    name:document.getElementById("name").value,
    ingredients:document.getElementById("ingredients").value,
    recipe:document.getElementById("recipe").value,
    favFor:document.getElementById("favFor").value,
    favorite:false
  };

  const finish=()=>{
    meals.unshift(meal);
    saveMeals();
    renderHome();
    switchView("home");
  };

  if(file){
    const r=new FileReader();
    r.onload=e=>{
      meal.photo=e.target.result;
      finish();
    };
    r.readAsDataURL(file);
  } else {
    meal.photo="";
    finish();
  }
}

/* PINTEREST MATCHING */
function renderHome(){
  const grid=document.getElementById("grid");
  const query=document.getElementById("ingredientSearch").value.toLowerCase();

  const terms=query.split(",").map(i=>i.trim()).filter(Boolean);

  let sorted = meals.map(m=>{
    let score=0;

    terms.forEach(t=>{
      if(m.ingredients?.toLowerCase().includes(t)) score+=2;
      if(m.name?.toLowerCase().includes(t)) score+=1;
    });

    return {...m,score};
  }).sort((a,b)=>b.score-a.score);

  grid.innerHTML="";

  sorted.forEach(m=>{
    grid.innerHTML+=`
      <div class="pin">
        ${m.photo?`<img src="${m.photo}">`:""}
        <div class="pin-title">${m.name}</div>

        <div class="pin-actions">
          <span>${m.favFor==="Adina"?"💛 Adina":"🤍"}</span>
        </div>
      </div>
    `;
  });

  lucide.createIcons();
}

/* FAVORITES */
function renderFav(){
  const grid=document.getElementById("favGrid");
  grid.innerHTML="";

  meals.filter(m=>m.favorite).forEach(m=>{
    grid.innerHTML+=`
      <div class="pin">
        ${m.photo?`<img src="${m.photo}">`:""}
        <div class="pin-title">${m.name}</div>
      </div>
    `;
  });
}

/* BACKUP */
function exportData(){
  const blob=new Blob([JSON.stringify(meals)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="backup.json";
  a.click();
}

function importData(e){
  const file=e.target.files[0];
  const r=new FileReader();
  r.onload=ev=>{
    meals=JSON.parse(ev.target.result);
    saveMeals();
    renderHome();
    renderFav();
  };
  r.readAsText(file);
}

/* INIT */
renderHome();
renderFav();
lucide.createIcons();

</script>

</body>
</html>
