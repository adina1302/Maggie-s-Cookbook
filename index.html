<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C65D2E">
<title>Maggie's Cookbook</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/lucide@latest"></script>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">

<style>
:root{
  --bg:#F8F2E7;
  --card:#ffffff;
  --text:#2d2a26;
  --muted:#7a736b;
  --accent:#C65D2E;
}

body.dark{
  --bg:#121212;
  --card:#1e1e1e;
  --text:#f2f2f2;
  --muted:#aaa;
  --accent:#e07b4f;
}

body{
  margin:0;
  font-family:"Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:90px;
  transition:0.3s ease;
}

/* HERO */
.hero{
  background:linear-gradient(135deg,var(--accent),#e07b4f);
  color:white;
  padding:26px;
  text-align:center;
  border-radius:0 0 24px 24px;
}

.hero h1{margin:0;font-size:22px;}
.hero p{margin-top:6px;font-size:13px;opacity:0.9}

/* CARD */
.card{
  background:var(--card);
  margin:14px;
  padding:14px;
  border-radius:16px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

input,textarea,select{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:1px solid rgba(0,0,0,0.08);
  background:transparent;
  color:var(--text);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}

.pin{
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

.pin img{
  width:100%;
  height:140px;
  object-fit:cover;
}

.pin-title{
  padding:10px;
  font-weight:600;
}

.pin-actions{
  display:flex;
  justify-content:space-between;
  padding:8px 10px 12px;
  cursor:pointer;
}

/* BUTTON */
button{
  border:none;
  border-radius:12px;
  padding:12px;
  font-weight:600;
  cursor:pointer;
}

.primary{
  background:var(--accent);
  color:white;
}

/* NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:var(--card);
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -8px 20px rgba(0,0,0,0.08);
}

.nav-item{
  color:var(--muted);
  cursor:pointer;
}

.nav-item.active{
  color:var(--accent);
}

/* FAB */
.fab{
  position:fixed;
  bottom:90px;
  right:18px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--accent);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- HERO (RESTORED EXACT PERSONAL MESSAGE) -->
<div class="hero">
  <h1>Maggie's Cookbook</h1>
  <p>Made by Maggie. Taste-tested and approved by Adina ❤️</p>
</div>

<!-- SEARCH -->
<div class="card">
  <input id="ingredientSearch"
         placeholder="What ingredients do you have?"
         oninput="renderHome()">
</div>

<!-- BACKUP & SYNC -->
<div class="card">
  <h3>Backup & Sync</h3>
  <button class="primary" onclick="exportData()">⬇️ Backup My Recipes</button>
  <input type="file" accept=".json" onchange="importData(event)">
</div>

<!-- HOME -->
<div id="home" class="view active">
  <div id="grid" class="grid"></div>
</div>

<!-- ADD -->
<div id="add" class="view">
  <div class="card">
    <h3>Add Recipe</h3>

    <input id="name" placeholder="Meal name">
    <input id="ingredients" placeholder="Ingredients (comma separated)">
    <textarea id="recipe" placeholder="Recipe"></textarea>
    <input id="photo" type="file" accept="image/*">

    <button class="primary" onclick="saveMeal()">Save</button>
  </div>
</div>

<!-- FAVORITES -->
<div id="fav" class="view">
  <div class="card">
    <h3>Favorites</h3>
    <div id="favGrid" class="grid"></div>
  </div>
</div>

<!-- NAV -->
<div class="bottom-nav">
  <div onclick="switchView('home')" class="nav-item active"><i data-lucide="home"></i></div>
  <div onclick="switchView('fav')" class="nav-item"><i data-lucide="heart"></i></div>
  <div onclick="switchView('add')" class="nav-item"><i data-lucide="plus"></i></div>
</div>

<div class="fab" onclick="switchView('add')">
  <i data-lucide="plus"></i>
</div>

<script>

let meals = JSON.parse(localStorage.getItem("cookbook")) || [];
let editId = null;

/* SAVE */
function saveMeals(){
  localStorage.setItem("cookbook", JSON.stringify(meals));
}

/* VIEW */
function switchView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* SAVE MEAL */
function saveMeal(){
  const file=document.getElementById("photo").files[0];

  const meal={
    id: editId || Date.now(),
    name:document.getElementById("name").value,
    ingredients:document.getElementById("ingredients").value,
    recipe:document.getElementById("recipe").value,
    favorite:false
  };

  const finish=()=>{
    if(editId){
      meals = meals.filter(m=>m.id!==editId);
    }

    meals.unshift(meal);
    saveMeals();

    editId=null;
    renderHome();
    switchView("home");
  };

  if(file){
    const r=new FileReader();
    r.onload=e=>{
      meal.photo=e.target.result;
      finish();
    };
    r.readAsDataURL(file);
  } else {
    meal.photo="";
    finish();
  }
}

/* DELETE */
function deleteMeal(id){
  if(!confirm("Delete this recipe?")) return;
  meals = meals.filter(m=>m.id!==id);
  saveMeals();
  renderHome();
}

/* FAVORITE */
function toggleFav(id){
  const m=meals.find(x=>x.id===id);
  m.favorite=!m.favorite;
  saveMeals();
  renderHome();
  renderFav();
}

/* MATCHING */
function renderHome(){
  const grid=document.getElementById("grid");
  const query=document.getElementById("ingredientSearch").value.toLowerCase();

  const ingredients=query.split(",").map(i=>i.trim()).filter(Boolean);

  let sorted = meals.map(m=>{
    let score=0;

    ingredients.forEach(i=>{
      if(m.ingredients?.toLowerCase().includes(i)) score+=2;
      if(m.name?.toLowerCase().includes(i)) score+=1;
    });

    return {...m,score};
  });

  sorted.sort((a,b)=>b.score-a.score);

  grid.innerHTML="";

  sorted.forEach(m=>{
    grid.innerHTML+=`
      <div class="pin">
        ${m.photo?`<img src="${m.photo}">`:""}
        <div class="pin-title">${m.name}</div>

        <div class="pin-actions">
          <span onclick="toggleFav(${m.id})">${m.favorite?"❤️":"🤍"}</span>
          <span onclick="deleteMeal(${m.id})"><i data-lucide="trash"></i></span>
        </div>
      </div>
    `;
  });

  lucide.createIcons();
}

/* FAVORITES */
function renderFav(){
  const grid=document.getElementById("favGrid");
  grid.innerHTML="";

  meals.filter(m=>m.favorite).forEach(m=>{
    grid.innerHTML+=`
      <div class="pin">
        ${m.photo?`<img src="${m.photo}">`:""}
        <div class="pin-title">${m.name}</div>
      </div>
    `;
  });

  lucide.createIcons();
}

/* BACKUP EXPORT */
function exportData(){
  const data = JSON.stringify(meals);
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);

  const a=document.createElement("a");
  a.href=url;
  a.download="cookbook-backup.json";
  a.click();

  URL.revokeObjectURL(url);
}

/* IMPORT */
function importData(e){
  const file=e.target.files[0];
  const reader=new FileReader();

  reader.onload=ev=>{
    meals=JSON.parse(ev.target.result);
    saveMeals();
    renderHome();
    renderFav();
  };

  reader.readAsText(file);
}

/* INIT */
renderHome();
renderFav();
lucide.createIcons();

</script>

</body>
</html>
