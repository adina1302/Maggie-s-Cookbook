<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C65D2E">
<title>Maggie's Cookbook</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>
:root{
  --bg:#F8F2E7;
  --card:#ffffff;
  --text:#2d2a26;
  --muted:#7a736b;
  --accent:#C65D2E;
}

/* =======================
   BACKGROUND + BLOBS
======================= */
body{
  margin:0;
  font-family:"Inter", sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:80px;
  overflow-x:hidden;
}

/* soft blobs */
.bg-blobs{
  position:fixed;
  inset:0;
  z-index:-1;
  overflow:hidden;
}

.blob{
  position:absolute;
  width:340px;
  height:340px;
  border-radius:50%;
  filter:blur(70px);
  opacity:0.22;
  mix-blend-mode:multiply;
  animation:float 24s ease-in-out infinite;
}

.b1{
  background:#f2c6a0;
  top:-100px;
  left:-80px;
}

.b2{
  background:#e8a87c;
  bottom:-120px;
  right:-90px;
  animation-duration:28s;
}

.b3{
  background:#f7d6bf;
  top:40%;
  left:60%;
  animation-duration:32s;
}

@keyframes float{
  0%{transform:translate(0,0) scale(1);}
  25%{transform:translate(40px,-60px) scale(1.05);}
  50%{transform:translate(-30px,40px) scale(0.95);}
  75%{transform:translate(60px,20px) scale(1.1);}
  100%{transform:translate(0,0) scale(1);}
}

/* =======================
   HEADER
======================= */
.hero{
  background:linear-gradient(135deg,var(--accent),#e07b4f);
  color:white;
  padding:26px;
  text-align:center;
  border-radius:0 0 24px 24px;
}

/* =======================
   PAGES
======================= */
.page{
  display:none;
  padding:14px;
  animation:fade 0.25s ease;
}

.page.active{
  display:block;
}

@keyframes fade{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

/* =======================
   PINTEREST GRID
======================= */
.grid{
  column-count:2;
  column-gap:12px;
}

.pin{
  break-inside:avoid;
  margin-bottom:12px;
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
  cursor:pointer;
  transition:0.2s;
}

.pin:active{transform:scale(0.98);}

.pin img{
  width:100%;
  display:block;
}

.pin-title{
  padding:10px;
  font-weight:600;
}

.pin-meta{
  padding:0 10px 10px;
  font-size:12px;
  color:var(--muted);
}

/* =======================
   INPUTS
======================= */
input,textarea,select{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:12px;
  border:1px solid rgba(0,0,0,0.1);
}

/* =======================
   BUTTONS
======================= */
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  margin-top:8px;
  cursor:pointer;
}

.primary{background:var(--accent);color:white;}
.secondary{background:#eee;}
.danger{background:#d64545;color:white;}

/* =======================
   NAV
======================= */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:rgba(255,255,255,0.9);
  backdrop-filter:blur(12px);
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -6px 20px rgba(0,0,0,0.08);
}

.nav-item{
  color:var(--muted);
  cursor:pointer;
}

.nav-item.active{
  color:var(--accent);
}

/* =======================
   FAB
======================= */
.fab{
  position:fixed;
  bottom:90px;
  right:18px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--accent);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

/* =======================
   MODAL
======================= */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  align-items:flex-end;
}

.modal-content{
  background:white;
  width:100%;
  max-height:90%;
  border-radius:20px 20px 0 0;
  padding:16px;
  overflow:auto;
}
</style>
</head>

<body>

<!-- 🌿 BACKGROUND BLOBS -->
<div class="bg-blobs">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<!-- HEADER -->
<div class="hero">
  <h1>Maggie's Cookbook</h1>
  <p>Made by Maggie. Taste-tested and approved by Adina ❤️</p>
</div>

<!-- HOME -->
<div id="home" class="page active">
  <div id="grid" class="grid"></div>
</div>

<!-- ADD PAGE -->
<div id="add" class="page">
  <h2>Add Recipe</h2>

  <input id="name" placeholder="Name">
  <input id="ingredients" placeholder="Ingredients">
  <input id="lastCooked" type="date">

  <select id="likedBy">
    <option>Both</option>
    <option>Adina</option>
    <option>Maggie</option>
  </select>

  <textarea id="recipe" placeholder="Recipe"></textarea>
  <input type="file" id="photo">

  <button class="primary" onclick="saveMeal()">Save</button>
</div>

<!-- FAVORITES -->
<div id="fav" class="page"></div>

<!-- FAB -->
<div class="fab" onclick="showAdd()">
  <i data-lucide="plus"></i>
</div>

<!-- NAV -->
<div class="bottom-nav">
  <div class="nav-item" onclick="showHome()"><i data-lucide="home"></i></div>
  <div class="nav-item" onclick="showFav()"><i data-lucide="heart"></i></div>
  <div class="nav-item" onclick="exportData()"><i data-lucide="download"></i></div>
</div>

<!-- MODAL -->
<div class="modal" id="view">
  <div class="modal-content" id="viewContent"></div>
</div>

<script>

let meals = JSON.parse(localStorage.getItem("cookbook")) || [];
let selected = null;

function saveMeals(){
  localStorage.setItem("cookbook", JSON.stringify(meals));
}

/* NAV */
function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function showHome(){
  showPage("home");
  renderHome();
}

function showFav(){
  showPage("fav");
  renderFav();
}

function showAdd(){
  showPage("add");
}

/* HOME */
function renderHome(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";

  meals.forEach(m=>{
    grid.innerHTML+=`
      <div class="pin" onclick="openMeal(${m.id})">
        ${m.photo?`<img src="${m.photo}">`:""}
        <div class="pin-title">${m.name}</div>
        <div class="pin-meta">❤️ ${m.likedBy}</div>
      </div>
    `;
  });

  lucide.createIcons();
}

/* FAVORITES */
function renderFav(){
  const fav=meals.filter(m=>m.favorite);
  const box=document.getElementById("fav");

  box.innerHTML="<h2>Favorites</h2>";

  fav.forEach(m=>{
    box.innerHTML+=`
      <div class="pin" onclick="openMeal(${m.id})">
        ${m.photo?`<img src="${m.photo}">`:""}
        <div class="pin-title">${m.name}</div>
      </div>
    `;
  });
}

/* SAVE */
function saveMeal(){
  const file=document.getElementById("photo").files[0];

  const meal={
    id:Date.now(),
    name:document.getElementById("name").value,
    ingredients:document.getElementById("ingredients").value,
    recipe:document.getElementById("recipe").value,
    likedBy:document.getElementById("likedBy").value,
    lastCooked:document.getElementById("lastCooked").value,
    favorite:false
  };

  const finish=()=>{
    meals.unshift(meal);
    saveMeals();
    showHome();
    renderHome();
  };

  if(file){
    const r=new FileReader();
    r.onload=e=>{meal.photo=e.target.result; finish();};
    r.readAsDataURL(file);
  } else {
    finish();
  }
}

/* OPEN */
function openMeal(id){
  selected=meals.find(m=>m.id===id);

  document.getElementById("viewContent").innerHTML=`
    <h2>${selected.name}</h2>
    ${selected.photo?`<img src="${selected.photo}" style="width:100%;border-radius:12px;">`:""}

    <p><b>Ingredients:</b><br>${selected.ingredients}</p>
    <p><b>Recipe:</b><br>${selected.recipe}</p>
    <p><b>Liked by:</b> ${selected.likedBy}</p>
    <p><b>Last cooked:</b> ${selected.lastCooked}</p>

    <button class="primary" onclick="toggleFav()">❤️ Favorite</button>
    <button class="danger" onclick="deleteMeal()">🗑️ Delete</button>
    <button class="secondary" onclick="closeView()">Close</button>
  `;

  document.getElementById("view").style.display="flex";
}

function closeView(){
  document.getElementById("view").style.display="none";
}

/* ACTIONS */
function toggleFav(){
  selected.favorite=!selected.favorite;
  saveMeals();
  renderHome();
  closeView();
}

function deleteMeal(){
  if(!confirm("Delete this recipe?")) return;
  meals=meals.filter(m=>m.id!==selected.id);
  saveMeals();
  renderHome();
  closeView();
}

/* BACKUP */
function exportData(){
  const blob=new Blob([JSON.stringify(meals)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="cookbook.json";
  a.click();
}

/* INIT */
renderHome();
lucide.createIcons();

</script>

</body>
</html>
