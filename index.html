<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C65D2E">
<title>Maggie's Cookbook</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --burnt:#C65D2E;
  --cream:#F8F2E7;
  --sage:#A7B89A;
  --text:#3E2C22;
  --card:#ffffff;
  --shadow:0 10px 30px rgba(0,0,0,0.08);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  background:var(--cream);
  color:var(--text);
  padding-bottom:90px;
  -webkit-font-smoothing:antialiased;
}

/* HEADER */
.hero{
  background:linear-gradient(135deg,var(--burnt),#e07b4f);
  color:white;
  padding:28px 20px;
  text-align:center;
  border-radius:0 0 28px 28px;
  box-shadow:var(--shadow);
}

.hero h1{
  margin:0;
  font-size:26px;
  font-weight:700;
}

.hero p{
  margin-top:6px;
  opacity:0.9;
  font-size:14px;
}

/* VIEWS */
.view{display:none;}
.view.active{display:block;animation:fade .25s ease;}

@keyframes fade{
  from{opacity:0;transform:translateY(6px);}
  to{opacity:1;transform:translateY(0);}
}

/* PINTEREST GRID (more premium spacing) */
.grid{
  columns:2 160px;
  column-gap:14px;
  padding:14px;
}

/* CARD (Pinterest pin) */
.pin{
  break-inside:avoid;
  margin-bottom:14px;
  background:var(--card);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease;
}

.pin:active{
  transform:scale(0.98);
}

.pin img{
  width:100%;
  display:block;
}

.pin-title{
  padding:10px 12px 4px;
  font-weight:600;
  font-size:14px;
}

.pin-actions{
  display:flex;
  justify-content:space-between;
  padding:8px 12px 12px;
  font-size:13px;
  opacity:0.85;
}

/* INPUT CARD */
.card{
  background:var(--card);
  margin:16px;
  padding:16px;
  border-radius:18px;
  box-shadow:var(--shadow);
}

input,textarea,select{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:12px;
  border:1px solid #eee;
  font-size:14px;
  outline:none;
}

input:focus,textarea:focus,select:focus{
  border-color:var(--burnt);
}

/* BUTTONS */
button{
  border:none;
  border-radius:14px;
  padding:12px 14px;
  font-weight:600;
  cursor:pointer;
  transition:transform .15s ease, opacity .15s ease;
}

button:active{
  transform:scale(0.98);
}

.primary{
  background:var(--burnt);
  color:white;
}

/* FLOATING BUTTON (more iOS-like) */
.fab{
  position:fixed;
  bottom:92px;
  right:18px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:var(--burnt);
  color:white;
  font-size:30px;
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  cursor:pointer;
}

/* BOTTOM NAV (iOS glass style) */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid rgba(0,0,0,0.05);
}

.nav-item{
  font-size:12px;
  color:#777;
  text-align:center;
  cursor:pointer;
  transition:all .15s ease;
}

.nav-item.active{
  color:var(--burnt);
  transform:translateY(-1px);
  font-weight:600;
}

</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="view active">

  <div class="hero">
    <h1>🍳 Maggie's Cookbook</h1>
    <p>Made by Maggie. Taste-tested and approved by Adina ❤️</p>
  </div>

  <div id="grid" class="grid"></div>
</div>

<!-- ADD -->
<div id="add" class="view">
  <div class="card">
    <h2 style="margin:0 0 10px;">Add Recipe</h2>

    <input id="name" placeholder="Meal name">

    <select id="tag">
      <option>Breakfast</option>
      <option>Lunch</option>
      <option>Dinner</option>
      <option>Dessert</option>
    </select>

    <textarea id="ingredients" placeholder="🥕 Ingredients"></textarea>
    <textarea id="recipe" placeholder="👩‍🍳 Recipe"></textarea>

    <input id="photo" type="file" accept="image/*">

    <button class="primary" onclick="saveMeal()">Save 💛</button>
  </div>
</div>

<!-- FAVORITES -->
<div id="fav" class="view">
  <div class="card">
    <h2 style="margin:0 0 10px;">❤️ Favorites</h2>
    <div id="favGrid" class="grid"></div>
  </div>
</div>

<!-- SURPRISE -->
<div id="surprise" class="view">
  <div class="card">
    <button class="primary" onclick="randomMeal()">🎲 Surprise me</button>
    <div id="randomBox"></div>
  </div>
</div>

<!-- FAB -->
<div class="fab" onclick="switchView('add')">+</div>

<!-- NAV -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchView('home')">🏠</div>
  <div class="nav-item" onclick="switchView('fav')">❤️</div>
  <div class="nav-item" onclick="switchView('surprise')">🎲</div>
</div>

<script>

let meals = JSON.parse(localStorage.getItem("maggiesCookbook")) || [];

function saveMeals(){
  localStorage.setItem("maggiesCookbook", JSON.stringify(meals));
}

/* VIEW SWITCH */
function switchView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  event.target.classList.add("active");
}

/* SAVE */
function saveMeal(){
  const file=document.getElementById("photo").files[0];

  const meal={
    id:Date.now(),
    name:document.getElementById("name").value,
    tag:document.getElementById("tag").value,
    ingredients:document.getElementById("ingredients").value,
    recipe:document.getElementById("recipe").value,
    favorite:false
  };

  if(!meal.name) return alert("Add a name 💛");

  const finish=()=>{
    meals.unshift(meal);
    saveMeals();
    renderAll();
    switchView("home");
  };

  if(file){
    const r=new FileReader();
    r.onload=e=>{
      meal.photo=e.target.result;
      finish();
    };
    r.readAsDataURL(file);
  } else {
    meal.photo="";
    finish();
  }
}

/* FAVORITE */
function toggleFav(id){
  const m=meals.find(x=>x.id===id);
  m.favorite=!m.favorite;
  saveMeals();
  renderAll();
}

/* HOME */
function renderHome(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";

  meals.forEach(m=>{
    grid.innerHTML+=`
      <div class="pin" onclick="toggleFav(${m.id})">
        ${m.photo?`<img src="${m.photo}">`:""}
        <div class="pin-title">${m.name}</div>
        <div class="pin-actions">
          <span>${m.tag}</span>
          <span>${m.favorite?"❤️":"🤍"}</span>
        </div>
      </div>
    `;
  });
}

/* FAVORITES */
function renderFav(){
  const grid=document.getElementById("favGrid");
  grid.innerHTML="";

  meals.filter(m=>m.favorite).forEach(m=>{
    grid.innerHTML+=`
      <div class="pin">
        ${m.photo?`<img src="${m.photo}">`:""}
        <div class="pin-title">${m.name}</div>
      </div>
    `;
  });
}

/* RANDOM */
function randomMeal(){
  const box=document.getElementById("randomBox");
  if(!meals.length) return;

  const m=meals[Math.floor(Math.random()*meals.length)];

  box.innerHTML=`
    <div class="card">
      <h3>${m.name}</h3>
      ${m.photo?`<img src="${m.photo}" style="width:100%;border-radius:12px;">`:""}
    </div>
  `;
}

/* RENDER */
function renderAll(){
  renderHome();
  renderFav();
}

renderAll();

</script>

</body>
</html>
