<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C65D2E">
<title>Maggie's Cookbook</title>

<style>
:root{
  --burnt:#C65D2E;
  --cream:#F8F2E7;
  --sage:#A7B89A;
  --text:#4A3428;
  --card:#FFFFFF;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--cream);
  color:var(--text);
}

/* Layout */
.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

/* Hero */
.hero{
  background:linear-gradient(135deg,var(--burnt),#d97a4d);
  color:white;
  padding:24px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.12);
}

.subtitle{opacity:.95;margin-top:8px}

/* Cards */
.card{
  background:var(--card);
  border-radius:20px;
  padding:16px;
  margin-top:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  transition:0.2s ease;
}

.card:hover{
  transform:translateY(-3px);
}

/* Inputs */
input,textarea,select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #ddd;
  margin-top:8px;
  margin-bottom:10px;
}

/* Buttons */
button{
  border:none;
  border-radius:14px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:600;
  transition:0.2s ease;
}

button:hover{
  transform:scale(1.02);
  opacity:0.9;
}

.primary{background:var(--burnt);color:white;}
.secondary{background:var(--sage);color:white;}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:14px;
}

/* Meal image */
.meal-img{
  width:100%;
  border-radius:14px;
  margin-top:10px;
  max-height:220px;
  object-fit:cover;
}

/* Tags */
.tag{
  display:inline-block;
  background:var(--sage);
  color:white;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
}

/* Favorite */
.favorite{
  font-size:22px;
  cursor:pointer;
}

/* Empty state */
.empty{
  text-align:center;
  opacity:0.7;
  padding:30px;
}

/* Modal */
.modal{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-content{
  background:white;
  max-width:600px;
  width:100%;
  border-radius:20px;
  padding:18px;
  max-height:90vh;
  overflow:auto;
}

.close{
  float:right;
  cursor:pointer;
  font-size:20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="hero">
    <h1>🍳 Maggie's Cookbook</h1>
    <p class="subtitle">
      Made with love — a little collection of meals worth making again 💛
    </p>
  </div>

  <!-- Random -->
  <div class="card">
    <input id="search" placeholder="🔍 Search meals..." oninput="renderMeals()">

    <button class="primary" onclick="randomMeal()">
      🎲 Cook something for me
    </button>

    <div id="randomBox"></div>
  </div>

  <!-- Add Meal -->
  <div class="card">
    <h2>➕ Add a Memory Meal</h2>

    <input id="name" placeholder="Meal name">

    <select id="tag">
      <option>Breakfast</option>
      <option>Lunch</option>
      <option>Dinner</option>
      <option>Dessert</option>
    </select>

    <input id="rating" type="number" min="1" max="5" value="5">

    <input id="date" type="date">

    <textarea id="ingredients" placeholder="What you'll need"></textarea>

    <textarea id="recipe" placeholder="How I made it for you"></textarea>

    <input id="photo" type="file" accept="image/*">

    <button class="primary" onclick="saveMeal()">Save Meal 💛</button>
  </div>

  <!-- Meals -->
  <div id="meals" class="grid"></div>

</div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✖</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>

let meals = JSON.parse(localStorage.getItem("maggiesCookbook")) || [];

function saveMeals(){
  localStorage.setItem("maggiesCookbook", JSON.stringify(meals));
}

function clearForm(){
  document.getElementById("name").value="";
  document.getElementById("ingredients").value="";
  document.getElementById("recipe").value="";
  document.getElementById("date").value="";
  document.getElementById("photo").value="";
  document.getElementById("rating").value=5;
  document.getElementById("tag").selectedIndex=0;
}

function saveMeal(){

  const file = document.getElementById("photo").files[0];

  const meal = {
    name: document.getElementById("name").value.trim(),
    tag: document.getElementById("tag").value,
    rating: document.getElementById("rating").value,
    date: document.getElementById("date").value,
    ingredients: document.getElementById("ingredients").value,
    recipe: document.getElementById("recipe").value,
    favorite:false,
    lastCooked:""
  };

  if(!meal.name){
    alert("Give your meal a name 💛");
    return;
  }

  function finish(){
    meals.unshift(meal);
    saveMeals();
    renderMeals();
    clearForm();
  }

  if(file){
    const reader = new FileReader();
    reader.onload = e=>{
      meal.photo = e.target.result;
      finish();
    };
    reader.readAsDataURL(file);
  } else {
    meal.photo="";
    finish();
  }
}

function toggleFavorite(i){
  meals[i].favorite = !meals[i].favorite;
  saveMeals();
  renderMeals();
}

function openMeal(i){
  const meal = meals[i];

  document.getElementById("modalBody").innerHTML = `
    <h2>${meal.name}</h2>

    ${meal.photo ? `<img class="meal-img" src="${meal.photo}">` : ""}

    <p><span class="tag">${meal.tag}</span></p>

    <p>⭐ ${"⭐".repeat(Number(meal.rating||0))}</p>

    <p><strong>What you'll need:</strong><br>${meal.ingredients||""}</p>

    <p><strong>How I made it for you:</strong><br>${meal.recipe||""}</p>

    <p><strong>Last cooked:</strong> ${meal.lastCooked || "Not yet"}</p>

    <button class="primary" onclick="cookAgain(${i})">
      🍳 Cook again
    </button>
  `;

  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function cookAgain(i){
  meals[i].lastCooked = new Date().toLocaleDateString();
  saveMeals();
  renderMeals();
  openMeal(i);
}

function randomMeal(){

  const box = document.getElementById("randomBox");

  if(meals.length===0){
    box.innerHTML="<p>Add some meals first 💛</p>";
    return;
  }

  const pool = meals.filter(m=>m.favorite || m.rating>=4);
  const list = pool.length ? pool : meals;

  const meal = list[Math.floor(Math.random()*list.length)];

  box.innerHTML = `
    <div class="card">
      <h3>💛 You should cook:</h3>
      <h2>${meal.name}</h2>
      ${meal.photo ? `<img class="meal-img" src="${meal.photo}">` : ""}
    </div>
  `;
}

function renderMeals(){

  const q = document.getElementById("search").value.toLowerCase();
  const box = document.getElementById("meals");

  box.innerHTML="";

  if(meals.length===0){
    box.innerHTML=`
      <div class="card empty">
        <h3>🍝 No meals yet</h3>
        <p>Add your first dish to start your little cookbook 💛</p>
      </div>
    `;
    return;
  }

  meals.forEach((m,i)=>{

    if(!m.name.toLowerCase().includes(q) && !m.tag.toLowerCase().includes(q)){
      return;
    }

    box.innerHTML += `
      <div class="card" onclick="openMeal(${i})">

        <div style="display:flex;justify-content:space-between;">
          <h3>${m.name}</h3>
          <span class="favorite" onclick="event.stopPropagation();toggleFavorite(${i})">
            ${m.favorite?"❤️":"🤍"}
          </span>
        </div>

        ${m.photo ? `<img class="meal-img" src="${m.photo}">` : ""}

        <p><span class="tag">${m.tag}</span></p>

        <p>⭐ ${"⭐".repeat(Number(m.rating||0))}</p>

      </div>
    `;
  });
}

renderMeals();

</script>

</body>
</html>
